name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17.1 SDK and NDK
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0" "ndk;27.2.12479018" --channel=3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest -PskipFairPlayNative=true --stacktrace --console=plain 2>&1 | tee unit-test.log

      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit-test.log
          if-no-files-found: ignore

      - name: Lint
        run: gradle lintDebug -PskipFairPlayNative=true

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug -PskipFairPlayNative=false --stacktrace --console=plain 2>&1 | tee assemble.log

      - name: Verify FairPlay bridge in APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            library="lib/${abi}/libatriscast_fairplay.so"
            if ! unzip -l "$apk" "$library" | grep -Fq "$library"; then
              echo "::error::Missing ${library} in ${apk}"
              exit 1
            fi
          done

      - name: Upload assemble diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assemble-log
          path: assemble.log
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atriscast-debug
          path: app/build/outputs/apk/debug/app-debug.apk
