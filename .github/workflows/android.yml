name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_PACKAGES="$(sdkmanager --list --channel=3)"
          printf '%s\n' "$SDK_PACKAGES" | grep -E 'platforms;android-(37|CinnamonBun)|build-tools;37' || true

          if printf '%s\n' "$SDK_PACKAGES" | grep -q 'platforms;android-37'; then
            PLATFORM_PACKAGE='platforms;android-37'
          elif printf '%s\n' "$SDK_PACKAGES" | grep -q 'platforms;android-CinnamonBun'; then
            PLATFORM_PACKAGE='platforms;android-CinnamonBun'
          else
            echo 'Android 17 platform package was not exposed by sdkmanager.' >&2
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE"
          sdkmanager "$PLATFORM_PACKAGE" "build-tools;36.0.0" --channel=3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Lint
        run: gradle lintDebug

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atriscast-debug
          path: app/build/outputs/apk/debug/app-debug.apk
